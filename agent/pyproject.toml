[project]
name = "radagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Radman", email = "radikahn@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bedrock-agentcore>=1.24.0",
    "botocore[crt]>=1.43.107",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "strands-harness>=0.1.2",
    "tzdata>=2026.5",
]

[project.scripts]
radagent = "radagent.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
