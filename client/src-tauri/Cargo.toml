[package]
name = "radagent-client"
version = "0.1.0"
description = "radAgent for macOS and iOS"
authors = ["Radman <radikahn@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "radagent_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Google's consent page sends the browser back to the app on the client's own scheme (src/remote/google.ts)
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Keychain on macOS and iOS, for the sign-in's refresh token
keyring = { version = "3", features = ["apple-native"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Proc-macros and build scripts: a stripped proc-macro dylib can't be loaded by rustc on macOS (E0463)
[profile.release.build-override]
strip = false
