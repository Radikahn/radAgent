# Compile checks on every push to main (and on pull requests into it), then the agent goes to AgentCore Runtime
# when agent/ differs from the commit the runtime is running. One-time setup: "GitHub Actions" in infra/README.md.
name: main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # redeploys the agent even when agent/ hasn't changed

# Runs on main queue up instead of cancelling each other, so a deploy is never cut off halfway. If a queued run is
# replaced by a newer one, nothing is lost: the newer run compares against what is actually deployed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  agent:
    name: Agent (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13" # the image's (agent/Dockerfile)
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: uv sync --locked
      - name: Compile
        run: |
          uv run --locked python -m compileall -q src
          uv run --locked python -c "import radagent.main, radagent.server.app, radagent.repl, radagent.tools"

  client:
    name: Client (TypeScript + Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build the web app (tsc + vite)
        run: bun run build
      # The app ships for macOS and iOS, but src-tauri has no platform-specific code, so checking it on Linux
      # catches Rust errors without spending macOS minutes. Tauri on Linux builds against WebKitGTK.
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: cargo check
        working-directory: client/src-tauri
        run: cargo check --locked --all-targets

  infra:
    name: Infra (Terraform)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for dir in infra infra/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  changes:
    name: Agent changed?
    needs: [agent, client, infra]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC sign-in to AWS
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    env:
      AGENT_RUNTIME_ID: ${{ vars.AGENT_RUNTIME_ID }}
    steps:
      - name: Check the repository variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          for name in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY AGENT_RUNTIME_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Actions variable ${name} is not set; run scripts/ci-vars.sh (infra/README.md, \"GitHub Actions\")"
              exit 1
            fi
          done
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to diff agent/ against the deployed commit
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Compare agent/ with the deployed image
        id: compare
        run: |
          uri="$(aws bedrock-agentcore-control get-agent-runtime --agent-runtime-id "$AGENT_RUNTIME_ID" \
            --query agentRuntimeArtifact.containerConfiguration.containerUri --output text)"
          tag="${uri##*:}"   # <short sha>-<timestamp>
          sha="${tag%%-*}"
          echo "Deployed: ${uri}"
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]] \
            && git rev-parse --verify --quiet "${sha}^{commit}" >/dev/null \
            && git diff --quiet "$sha" HEAD -- agent; then
            echo "agent/ is unchanged since ${sha}, which is deployed; nothing to deploy." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy agent
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm # the runtime is arm64, so the image builds natively
    permissions:
      contents: read
      id-token: write
    env:
      AGENT_RUNTIME_ID: ${{ vars.AGENT_RUNTIME_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Name the image
        id: image
        # Tags are immutable, <short sha>-<timestamp> like scripts/deploy-agent.sh's
        run: echo "uri=${ECR_REPOSITORY}:$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: agent
          platforms: linux/arm64
          provenance: false # a plain image manifest instead of an index with an attestation
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Point the runtime at the image
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          scripts/update-runtime.sh "$AGENT_RUNTIME_ID" "$IMAGE"
          echo "Deployed ${IMAGE} to ${AGENT_RUNTIME_ID}" >> "$GITHUB_STEP_SUMMARY"
